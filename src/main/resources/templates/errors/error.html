<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${error != null ? error.status + ' - ' + error.error : 'Ops! Ocorreu um erro'}">Erro - Gestão de Vagas</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .code-font {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4 sm:p-6 relative overflow-x-hidden selection:bg-red-500/20 selection:text-red-300">
    <!-- Efeitos de iluminação de fundo -->
    <div class="fixed -top-40 -left-40 w-96 h-96 bg-red-600/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fixed -bottom-40 -right-40 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <main class="w-full max-w-2xl relative z-10">
        <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 sm:p-10 shadow-2xl shadow-slate-950/60 relative overflow-hidden">
            <!-- Linha decorativa superior -->
            <div class="absolute top-0 inset-x-0 h-1 bg-gradient-to-r from-red-500 via-amber-500 to-indigo-500"></div>

            <!-- Cabeçalho do Erro -->
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-5 pb-6 border-b border-slate-800">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 rounded-2xl bg-red-500/10 border border-red-500/20 flex items-center justify-center text-red-400 shrink-0 shadow-lg shadow-red-500/10">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                        </svg>
                    </div>
                    <div>
                        <div class="flex items-center gap-2.5">
                            <span class="text-xs font-semibold uppercase tracking-wider text-red-400 bg-red-500/10 px-2.5 py-0.5 rounded-full border border-red-500/20"
                                  th:text="${error != null ? 'HTTP ' + error.status : 'Erro'}">
                                HTTP 500
                            </span>
                            <span class="text-xs text-slate-500 code-font" 
                                  th:text="${error != null ? error.time : #temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm:ss')}">
                                2026-09-23T14:50:00
                            </span>
                        </div>
                        <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight mt-1" 
                            th:text="${error != null ? error.error : 'Erro Inesperado'}">
                            Internal Server Error
                        </h1>
                    </div>
                </div>

                <div class="hidden sm:block text-right">
                    <span class="text-4xl font-extrabold text-slate-800 select-none code-font" 
                          th:text="${error != null ? error.status : '500'}">500</span>
                </div>
            </div>

            <!-- Detalhes do Erro -->
            <div class="mt-6 space-y-4">
                <!-- Mensagem Principal -->
                <div class="p-4 bg-slate-950/60 border border-slate-800/80 rounded-2xl">
                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Mensagem</p>
                    <p class="text-sm sm:text-base text-slate-200" 
                       th:text="${error != null and error.message != null and !#strings.isEmpty(error.message) ? error.message : 'Nenhuma mensagem detalhada foi fornecida pelo servidor.'}">
                        Ocorreu um erro interno ao processar a sua solicitação.
                    </p>
                </div>

                <!-- Rota / Caminho Solicitado -->
                <div class="p-4 bg-slate-950/60 border border-slate-800/80 rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">
                    <span class="font-medium text-slate-400">Recurso Acessado:</span>
                    <span class="code-font text-indigo-400 bg-indigo-500/10 px-2.5 py-1 rounded-lg border border-indigo-500/20 break-all" 
                          th:text="${error != null ? error.path : '/'}">
                        /exemplo/rota
                    </span>
                </div>
            </div>

            <!-- Ações -->
            <div class="mt-8 flex flex-col sm:flex-row items-center justify-end gap-3 pt-6 border-t border-slate-800">
                <button type="button" onclick="history.back()" class="w-full sm:w-auto px-5 py-2.5 bg-slate-800 hover:bg-slate-700/80 border border-slate-700 text-slate-200 text-xs sm:text-sm font-medium rounded-xl transition-all cursor-pointer flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    Voltar
                </button>
                <a th:href="@{/}" class="w-full sm:w-auto px-5 py-2.5 bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white text-xs sm:text-sm font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition-all cursor-pointer flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    Página Inicial
                </a>
            </div>
        </div>
    </main>
</body>
</html>
