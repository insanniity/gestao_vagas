<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="layout(title, activeMenu, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Gestão de Vagas</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script
        src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
        crossorigin="anonymous"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .code-font {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 relative overflow-x-hidden selection:bg-indigo-500/20 selection:text-indigo-300">
    <!-- Efeitos de iluminação de fundo -->
    <div class="fixed -top-40 -left-40 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fixed top-1/2 -right-40 w-96 h-96 bg-blue-600/15 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Barra de Navegação Superior -->
    <header class="sticky top-0 z-40 bg-slate-950/80 backdrop-blur-xl border-b border-slate-800/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <!-- Logo / Brand -->
            <a th:href="@{/}" class="flex items-center gap-3 group">
                <div class="w-10 h-10 bg-gradient-to-tr from-indigo-600 to-blue-500 rounded-xl flex items-center justify-center shadow-md shadow-indigo-500/20 group-hover:scale-105 transition-transform">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                </div>
                <span class="text-lg font-bold tracking-tight text-white group-hover:text-indigo-300 transition-colors">Gestão de Vagas</span>
            </a>

            <!-- Navegação Desktop -->
            <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-300">
                <a th:href="@{/vagas}" 
                   class="transition-colors flex items-center gap-1.5"
                   th:classappend="${activeMenu == 'vagas' ? 'text-indigo-400 font-semibold' : 'hover:text-white'}">
                    <span th:if="${activeMenu == 'vagas'}" class="w-1.5 h-1.5 rounded-full bg-indigo-400"></span>
                    Vagas Disponíveis
                </a>
                <a th:href="@{/candidaturas}" 
                   sec:authorize="hasRole('CANDIDATO')"
                   class="transition-colors flex items-center gap-1.5"
                   th:classappend="${activeMenu == 'candidaturas' ? 'text-indigo-400 font-semibold' : 'hover:text-white'}">
                    <span th:if="${activeMenu == 'candidaturas'}" class="w-1.5 h-1.5 rounded-full bg-indigo-400"></span>
                    Minhas Candidaturas
                </a>
                <a th:href="@{/candidatos}" 
                   sec:authorize="hasRole('ADMIN')"
                   class="transition-colors flex items-center gap-1.5"
                   th:classappend="${activeMenu == 'candidatos' ? 'text-indigo-400 font-semibold' : 'hover:text-white'}">
                    <span th:if="${activeMenu == 'candidatos'}" class="w-1.5 h-1.5 rounded-full bg-indigo-400"></span>
                    Candidatos Disponíveis
                </a>
                <a th:href="@{/perfil}" 
                   class="transition-colors flex items-center gap-1.5"
                   th:classappend="${activeMenu == 'perfil' ? 'text-indigo-400 font-semibold' : 'hover:text-white'}">
                    <span th:if="${activeMenu == 'perfil'}" class="w-1.5 h-1.5 rounded-full bg-indigo-400"></span>
                    Meu Perfil
                </a>
            </nav>

            <!-- Ações do Usuário e Identificação de Papel -->
            <div class="flex items-center gap-3">
                <!-- Badge de Papel/Role do Usuário -->
                <div class="hidden sm:flex items-center">
                    <span sec:authorize="hasRole('ADMIN')" class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-purple-500/10 text-purple-400 border border-purple-500/20">
                        ADMIN
                    </span>
                    <span sec:authorize="hasRole('RECRUTADOR')" class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-blue-500/10 text-blue-400 border border-blue-500/20">
                        RECRUTADOR
                    </span>
                    <span sec:authorize="hasRole('CANDIDATO')" class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                        CANDIDATO
                    </span>
                </div>

                <!-- Botão Nova Vaga (Apenas ADMIN e RECRUTADOR) -->
                <a th:href="@{/vagas/nova}" 
                   sec:authorize="hasAnyRole('ADMIN', 'RECRUTADOR')"
                   class="hidden sm:flex items-center gap-1.5 text-xs font-semibold px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white shadow-md shadow-indigo-600/25 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    <span>Nova Vaga</span>
                </a>

                <button type="button" onclick="openLogoutModal()" class="flex items-center gap-2 text-xs sm:text-sm font-medium text-slate-400 hover:text-red-400 border border-slate-800 hover:border-red-500/30 px-3.5 py-1.5 rounded-xl bg-slate-900/60 transition-all cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                    <span>Sair</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal Injetado pelas Páginas -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10 space-y-8 relative z-10">
        <div th:replace="${content}">
            <!-- O conteúdo da view filha será renderizado aqui -->
        </div>
    </main>

    <!-- Modal de Confirmação de Logout -->
    <div id="logoutModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-200">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl shadow-slate-950 transform scale-95 transition-transform duration-200" id="logoutModalCard">
            <div class="flex items-center gap-4 mb-4">
                <div class="w-12 h-12 rounded-2xl bg-red-500/10 border border-red-500/20 flex items-center justify-center text-red-400 shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-white">Deseja realmente sair?</h3>
                    <p class="text-xs sm:text-sm text-slate-400 mt-0.5">Sua sessão atual será encerrada.</p>
                </div>
            </div>

            <div class="flex items-center justify-end gap-3 mt-6">
                <button type="button" onclick="closeLogoutModal()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700/80 border border-slate-700 text-slate-300 text-xs sm:text-sm font-medium rounded-xl transition-colors cursor-pointer">
                    Cancelar
                </button>
                <form th:action="@{/logout}" method="post" class="inline m-0 p-0">
                    <button type="submit" class="px-5 py-2.5 bg-red-600 hover:bg-red-500 active:scale-[0.99] text-white text-xs sm:text-sm font-semibold rounded-xl shadow-lg shadow-red-600/30 transition-all cursor-pointer inline-flex items-center gap-2">
                        Sim, Sair
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function openLogoutModal() {
            const modal = document.getElementById('logoutModal');
            const card = document.getElementById('logoutModalCard');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                card.classList.remove('scale-95');
                card.classList.add('scale-100');
            }, 10);
        }

        function closeLogoutModal() {
            const modal = document.getElementById('logoutModal');
            const card = document.getElementById('logoutModalCard');
            modal.classList.add('opacity-0');
            card.classList.remove('scale-100');
            card.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        // Fechar ao pressionar Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLogoutModal();
        });

        // Fechar ao clicar no fundo escuro
        document.getElementById('logoutModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeLogoutModal();
        });
    </script>
</body>
</html>
